<!DOCTYPE html>
<html>
<head>
    <title>Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body onload="sendClick('product')">

<div class="nav">
    <div id="userDisplay"></div>
    <div>
        <a href="/index" onclick="sendClick('nav_home')">Home</a>
        <a href="/product" onclick="sendClick('nav_product')">Product</a>
        <a href="/cart" onclick="sendClick('nav_cart')">Cart</a>
    </div>
</div>

<div class="card">
    <img src="{{ url_for('static', filename='Product1.png') }}">

    <h2>Headphones</h2>
    <p>₹999</p>

    <button class="btn" onclick="/addToCart()">Add to Cart</button>
</div>

<script src="script.js"></script>

<script>
function addToCart() {
    sendClick('cart');
    window.location.href = "/cart";
}
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
